services:
  relay:
    build: .
    container_name: zero-margin-relay
    restart: unless-stopped
    # Only reachable from this machine; the public route is the Cloudflare tunnel.
    ports:
      - "127.0.0.1:7700:7700"
    environment:
      # The header the tunnel or proxy in front sets to the player's address. It must overwrite whatever the client sent.
      - PROXY_HEADER=cf-connecting-ip
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
